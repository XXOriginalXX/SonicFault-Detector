name: sonic_fault
description: Vehicle complaint detection app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0          # backend API calls
  crypto: ^3.0.3        # MD5 lookup

  # Audio
  record: ^5.2.0          # Mic recording (platform interface 1.5.x compatible)
  just_audio: ^0.9.36     # Audio playback
  file_picker: ^8.1.2     # File selection

  # DSP / feature extraction (Dart port)
  fftea: ^1.3.0           # FFT for MFCC
  collection: ^1.18.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # UI
  lottie: ^2.7.0          # Splash animation
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0       # Confidence bar chart

  # Misc
  permission_handler: ^11.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/rf_model.json
    - assets/labels.txt
    - assets/features_db.json
    - assets/logo.jpeg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"